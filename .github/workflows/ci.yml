name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - development

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check merge markers
        run: |
          if grep -rnE '^(<<<<<<<|=======|>>>>>>>)' docs packages apps --exclude-dir=node_modules --exclude-dir=.next --exclude-dir=dist; then
            echo "Penanda konflik merge ditemukan." >&2
            exit 1
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Ensure Chromium for responsive browser tests
        run: |
          if ! command -v google-chrome >/dev/null && ! command -v chromium >/dev/null && ! command -v chromium-browser >/dev/null; then
            echo "Chromium/Google Chrome is required for responsive browser tests." >&2
            exit 1
          fi

      - name: Test
        run: npm run test

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SERVER_URL: http://localhost:3002

      - name: Verify rendered typography
        run: npm run test:fonts -w @pejuang/web